            if (this.score < 35) return;
            
            // Random heart - rare
            if (this.time - this.lastHeartTime > 900 && Math.random() < 0.003) {
                this.lastHeartTime = this.time;
                this.hearts.push({
                    x: this.bird.x,
                    y: this.bird.y - this.bird.radius,
                    vy: -2,
                    life: 1,
                    size: 15,
                    wobble: 0
                });
                playHeart();
            }
        },
        
        maybeStars: function() {
            // Only stars after score reaches 45
            if (this.score < 45) return;
            
            // Random stars burst - rare
            if (this.time - this.lastStarsTime > 1200 && Math.random() < 0.003) {
                this.lastStarsTime = this.time;
                // Create burst of stars
                for (var i = 0; i < 12; i++) {
                    var angle = (i / 12) * Math.PI * 2;
                    var speed = 3 + Math.random() * 3;
                    this.stars.push({
                        x: this.bird.x,
                        y: this.bird.y,
                        vx: Math.cos(angle) * speed,
                        vy: Math.sin(angle) * speed,
                        life: 1,
                        size: 4 + Math.random() * 4,
                        rotation: Math.random() * Math.PI * 2,
                        rotationSpeed: (Math.random() - 0.5) * 0.3
                    });
                }
                playStars();
            }
        },

        maybeChirp: function() {
            if (this.score < 5) return;
            if (this.time - this.lastChirpTime > 220 && Math.random() < 0.001) {
                this.lastChirpTime = this.time;
                this.spawnChirp(this.bird.x + this.bird.radius * 0.6, this.bird.y - this.bird.radius * 0.8);
                playChirp();
            }
        },

        spawnChirp: function(x, y) {
            this.chirps.push({
                x: x,
                y: y,
                vy: -1.2 - Math.random(),
                life: 1,
                wobble: Math.random() * Math.PI * 2,
                scale: 0.9 + Math.random() * 0.4
            });
        },

        spawnSparkle: function(x, y, color) {
            this.sparkles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                life: 1,
                size: 3 + Math.random() * 3,
                rotation: Math.random() * Math.PI * 2,
                color: color || '#ffeaa7'
            });
        },

        getSpeed: function() {
            // Start at 3.5, increase by 0.15 every 10 pipes, max at 6.5
            var baseSpeed = 3.5;
            var speedIncrease = Math.floor(this.pipesPassed / 10) * 0.15;
            return Math.min(baseSpeed + speedIncrease, 6.5);
        },
        
        die: function() {
            this.state = 'dead';
            playDie();
            submitScore(this.score, Math.floor(this.distance));
            
            document.getElementById('hud').classList.add('hidden');
            document.getElementById('finalScore').textContent = this.score;
            document.getElementById('finalDistance').textContent = Math.floor(this.distance) + ' meters';
            
            var quote = getQuoteForScore(this.score);
            document.getElementById('quoteText').textContent = '"' + quote + '"';
            
            document.getElementById('gameOver').classList.remove('hidden');
        },
        
        update: function() {
            this.time++;
            
            // Particles
            this.particles = this.particles.filter(function(p) {
                p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.025;
                return p.life > 0;
            });
            
            // Fart particles
            this.fartParticles = this.fartParticles.filter(function(p) {
                p.x += p.vx; p.y += p.vy; p.size *= 1.02; p.life -= 0.015;
                return p.life > 0;
            });
            
            // Clouds wobble
            for (var i = 0; i < this.clouds.length; i++) {
                this.clouds[i].wobble += 0.02;
                this.clouds[i].y += Math.sin(this.clouds[i].wobble) * 0.15;
            }

            // Background stars twinkle
            for (var i = 0; i < this.backgroundStars.length; i++) {
                this.backgroundStars[i].twinkle += 0.02;
            }

            // Fireflies drift
            for (var i = 0; i < this.fireflies.length; i++) {
                var f = this.fireflies[i];
                f.x += f.vx * this.deltaTime;
                f.y += f.vy * this.deltaTime;
                f.glow += 0.05 * this.deltaTime;
                if (f.x < -20) f.x = canvas.width + 20;
                if (f.x > canvas.width + 20) f.x = -20;
                if (f.y < this.ceilingY + 20) f.y = this.ceilingY + 20;
                if (f.y > this.groundY - 20) f.y = this.groundY - 20;
            }
            
            // Bird animation
            this.bird.wingPhase += this.bird.flapAnim > 0.2 ? 0.5 : 0.15;
            this.bird.flapAnim *= 0.85;
            this.bird.blink++;
            
            if (this.state === 'ready') {
                this.bird.y = canvas.height / 2 + Math.sin(this.time * 0.04) * 12;
                this.bird.rotation = Math.sin(this.time * 0.03) * 0.1;
                return;
            }
            
            if (this.state !== 'playing') return;
            
            this.maybeFart();
            this.maybePoop();
            this.maybeFlip();
            this.maybeHeart();
            this.maybeStars();
            this.maybeChirp();

            if (this.bird.flapAnim > 0.6 && Math.random() < 0.4) {
                this.spawnSparkle(this.bird.x - this.bird.radius * 0.2, this.bird.y - this.bird.radius * 0.5, '#fff6b3');
            }
            
            // Update flip animation (visual only, doesn't affect physics)
            if (this.bird.flipping) {
                this.bird.flipProgress += 0.08 * this.deltaTime;
                this.bird.flipRotation = this.bird.flipProgress * Math.PI * 2;
                if (Math.random() < 0.6) {
                    this.spawnSparkle(
                        this.bird.x + (Math.random() - 0.5) * this.bird.radius,
                        this.bird.y + (Math.random() - 0.5) * this.bird.radius,
                        '#ffd166'
                    );
                }
                if (this.bird.flipProgress >= 1) {
                    this.bird.flipping = false;
                    this.bird.flipProgress = 0;
                    this.bird.flipRotation = 0;
                }
            }
            
            // Update hearts
            for (var i = 0; i < this.hearts.length; i++) {
                var heart = this.hearts[i];
                heart.y += heart.vy * this.deltaTime;
                heart.vy -= 0.02 * this.deltaTime;
                heart.wobble += 0.1 * this.deltaTime;
                heart.x += Math.sin(heart.wobble) * 0.5 * this.deltaTime;
                heart.life -= 0.008 * this.deltaTime;
                heart.size += 0.1 * this.deltaTime;
            }
            this.hearts = this.hearts.filter(function(h) { return h.life > 0; });
            
            // Update stars
            for (var i = 0; i < this.stars.length; i++) {
                var star = this.stars[i];
                star.x += star.vx * this.deltaTime;
                star.y += star.vy * this.deltaTime;
                star.vy += 0.05 * this.deltaTime;
                star.vx *= Math.pow(0.99, this.deltaTime);
                star.rotation += star.rotationSpeed * this.deltaTime;
                star.life -= 0.015 * this.deltaTime;
            }
            this.stars = this.stars.filter(function(s) { return s.life > 0; });

            // Update chirps
            for (var i = 0; i < this.chirps.length; i++) {
                var chirp = this.chirps[i];
                chirp.y += chirp.vy * this.deltaTime;
                chirp.wobble += 0.12 * this.deltaTime;
                chirp.x += Math.sin(chirp.wobble) * 0.4 * this.deltaTime;
                chirp.life -= 0.02 * this.deltaTime;
            }
            this.chirps = this.chirps.filter(function(c) { return c.life > 0; });

            // Update sparkles
            for (var i = 0; i < this.sparkles.length; i++) {
                var sp = this.sparkles[i];
                sp.x += sp.vx * this.deltaTime;
                sp.y += sp.vy * this.deltaTime;
                sp.vx *= 0.98;
                sp.vy *= 0.98;
                sp.rotation += 0.2 * this.deltaTime;
                sp.life -= 0.03 * this.deltaTime;
            }
            this.sparkles = this.sparkles.filter(function(s) { return s.life > 0; });
            
            // Update poops
            var poopSpeed = this.getSpeed() * this.deltaTime;
            for (var i = 0; i < this.poops.length; i++) {
                var poop = this.poops[i];
                if (!poop.landed) {
                    poop.vy += 0.3 * this.deltaTime;
                    poop.y += poop.vy * this.deltaTime;
                    poop.x -= poopSpeed; // Move with world
                    
                    // Check if landed on ground
                    if (poop.y >= this.groundY - 5) {
                        poop.landed = true;
                        poop.y = this.groundY - 5;
                        poop.landedY = poop.y;
                        if (!poop.splatted) {
                            poop.splatted = true;
                            poop.splatSize = poop.size * 2.1;
                        }
                    }
                    
                    // Check if landed on a pipe
                    for (var j = 0; j < this.pipes.length; j++) {
                        var p = this.pipes[j];
                        var pipeTop = p.gapY - p.gap/2;
                        var pipeBot = p.gapY + p.gap/2;
                        
                        if (poop.x > p.x - p.width/2 - 8 && poop.x < p.x + p.width/2 + 8) {
                            // Check top pipe cap
                            if (poop.y >= pipeTop - 25 && poop.y <= pipeTop && poop.vy > 0) {
                                poop.landed = true;
                                poop.y = pipeTop - 25;
                                poop.landedY = poop.y;
                                poop.onPipe = j;
                                if (!poop.splatted) {
                                    poop.splatted = true;
                                    poop.splatSize = poop.size * 2.1;
                                }
                            }
                            // Check bottom pipe cap
                            if (poop.y >= pipeBot && poop.y <= pipeBot + 10 && poop.vy > 0) {
                                poop.landed = true;
                                poop.y = pipeBot;
                                poop.landedY = poop.y;
                                poop.onPipe = j;
                                if (!poop.splatted) {
                                    poop.splatted = true;
                                    poop.splatSize = poop.size * 2.1;
                                }
                            }
                        }
                    }
                } else {
                    // Landed poop moves with world
                    poop.x -= poopSpeed;
                }
            }
            
            // Remove poops that are off screen
            this.poops = this.poops.filter(function(p) {
                var buffer = (p.splatSize || 0) + 50;
                return p.x > -buffer;
            });
            
            // Physics - using deltaTime for consistent speed across devices
            var dt = this.deltaTime;
            this.bird.vy += 0.375 * dt;
            if (this.bird.vy > 9) this.bird.vy = 9;
            this.bird.y += this.bird.vy * dt;
            
            var targetRot = this.bird.vy * 0.08;
            targetRot = Math.max(-0.5, Math.min(1.2, targetRot));
            this.bird.rotation += (targetRot - this.bird.rotation) * 0.1;
            
            this.distance += 0.2;
            
            // Clouds scroll - using deltaTime
            for (var i = 0; i < this.clouds.length; i++) {
                var c = this.clouds[i];
                c.x -= c.speed * this.deltaTime;
                if (c.x < -c.size * 2) {
                    c.x = canvas.width + c.size;
                    c.y = 80 + Math.random() * (canvas.height * 0.3);
                }
            }
            
            // Hills scroll - three layers with parallax, using deltaTime
            var currentSpeed = this.getSpeed() * this.deltaTime;
            
            // Back hills (slowest - 30% of pipe speed)
            for (var i = 0; i < this.hillsBack.length; i++) {
                this.hillsBack[i].x -= currentSpeed * 0.3;
            }
            var lastHillBack = this.hillsBack[this.hillsBack.length - 1];
            if (lastHillBack && lastHillBack.x + lastHillBack.width / 2 < canvas.width + 300) {
                this.hillsBack.push({
                    x: lastHillBack.x + 180 + Math.random() * 120,
                    height: 100 + Math.random() * 80,
                    width: 250 + Math.random() * 300
                });
            }
            this.hillsBack = this.hillsBack.filter(function(h) { return h.x + h.width > -200; });
            
            // Mid hills (medium - 50% of pipe speed)
            for (var i = 0; i < this.hillsMid.length; i++) {
                this.hillsMid[i].x -= currentSpeed * 0.5;
            }
            var lastHillMid = this.hillsMid[this.hillsMid.length - 1];
            if (lastHillMid && lastHillMid.x + lastHillMid.width / 2 < canvas.width + 300) {
                this.hillsMid.push({
                    x: lastHillMid.x + 120 + Math.random() * 100,
                    height: 60 + Math.random() * 50,
                    width: 180 + Math.random() * 200
                });
            }
            this.hillsMid = this.hillsMid.filter(function(h) { return h.x + h.width > -150; });
            
            // Front hills (fastest - 70% of pipe speed)
            for (var i = 0; i < this.hillsFront.length; i++) {
                this.hillsFront[i].x -= currentSpeed * 0.7;
            }
            var lastHillFront = this.hillsFront[this.hillsFront.length - 1];
            if (lastHillFront && lastHillFront.x + lastHillFront.width / 2 < canvas.width + 300) {
                this.hillsFront.push({
                    x: lastHillFront.x + 80 + Math.random() * 80,
                    height: 30 + Math.random() * 40,
                    width: 120 + Math.random() * 150
                });
            }
            this.hillsFront = this.hillsFront.filter(function(h) { return h.x + h.width > -100; });
            
            // Pipes - using deltaTime
            var self = this;
            var currentSpeed = this.getSpeed() * this.deltaTime;
            for (var i = this.pipes.length - 1; i >= 0; i--) {
                var p = this.pipes[i];
                p.x -= currentSpeed;
                p.glow += 0.05;
                
                var hr = this.bird.radius * 0.55;
                if (this.bird.x + hr > p.x - p.width/2 && this.bird.x - hr < p.x + p.width/2) {
                    if (this.bird.y - hr < p.gapY - p.gap/2 || this.bird.y + hr > p.gapY + p.gap/2) {
                        this.die();
                        return;
                    }
                }
                
                if (!p.passed && p.x + p.width/2 < this.bird.x) {
                    p.passed = true;
                    this.score++;
                    this.pipesPassed++;
                    document.getElementById('scoreDisplay').textContent = this.score;
                    playScore();

                    // Celebration every 10 points
                    if (this.score % 10 === 0) {
                        showCelebration();
                    }
                }
                
                if (p.x < -p.width) {
                    this.pipes.splice(i, 1);
                }
            }
            
            var last = this.pipes[this.pipes.length - 1];
            if (!last || last.x < canvas.width - 280) {
                this.spawnPipe(canvas.width + 100);
            }
            
            if (this.bird.y > this.groundY - this.bird.radius || this.bird.y < this.ceilingY + this.bird.radius) {
                this.die();
            }
        },
        
        render: function() {
            var dayPhase = getDayPhase(this.time);
            var sunAlpha = Math.max(0, Math.min(1, (dayPhase - 0.35) / 0.65));
            var nightMix = Math.pow(Math.max(0, (0.35 - dayPhase) / 0.35), 1.4);
            var sunset = Math.max(0, 1 - Math.abs(dayPhase - 0.5) * 2);

            // Sky gradient
            var bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
            bg.addColorStop(0, mixColor('#87ceeb', '#0b1026', nightMix));
            bg.addColorStop(0.4, mixColor('#a8e0f8', '#1a2750', nightMix));
            bg.addColorStop(0.7, mixColor('#c8ecff', '#2a3b6b', nightMix));
            bg.addColorStop(1, mixColor('#d8f4ff', '#2f4d6f', nightMix));
            ctx.fillStyle = bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (sunset > 0.01) {
                var dusk = ctx.createLinearGradient(0, canvas.height * 0.2, 0, canvas.height * 0.9);
                dusk.addColorStop(0, 'rgba(255, 170, 120,' + (0.18 * sunset) + ')');
                dusk.addColorStop(0.6, 'rgba(255, 120, 180,' + (0.12 * sunset) + ')');
                dusk.addColorStop(1, 'rgba(120, 80, 160,' + (0.08 * sunset) + ')');
                ctx.fillStyle = dusk;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            // Stars
            if (nightMix > 0.05) {
                ctx.save();
                ctx.fillStyle = '#ffffff';
                for (var i = 0; i < this.backgroundStars.length; i++) {
                    var star = this.backgroundStars[i];
                    var twinkle = 0.6 + Math.sin(star.twinkle) * 0.4;
                    ctx.globalAlpha = twinkle * nightMix;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
                ctx.globalAlpha = 1;
            }

            // Sun & Moon
            var sunX = canvas.width * (0.1 + dayPhase * 0.8);
            var sunY = canvas.height * (0.2 + Math.sin(dayPhase * Math.PI) * -0.12);
            ctx.save();
            ctx.globalAlpha = 0.9 * sunAlpha;
            var sunGlow = ctx.createRadialGradient(sunX, sunY, 10, sunX, sunY, 90);
            sunGlow.addColorStop(0, 'rgba(255, 238, 180, 0.9)');
            sunGlow.addColorStop(1, 'rgba(255, 238, 180, 0)');
            ctx.fillStyle = sunGlow;
            ctx.beginPath();
            ctx.arc(sunX, sunY, 90, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffe59a';
            ctx.beginPath();
            ctx.arc(sunX, sunY, 45, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            var moonPhase = (dayPhase + 0.5) % 1;
            var moonX = canvas.width * (0.1 + moonPhase * 0.8);
            var moonY = canvas.height * (0.25 + Math.sin(moonPhase * Math.PI) * -0.12);
            ctx.save();
            ctx.globalAlpha = 0.85 * nightMix;
            var moonGlow = ctx.createRadialGradient(moonX, moonY, 8, moonX, moonY, 70);
            moonGlow.addColorStop(0, 'rgba(210, 220, 255, 0.8)');
            moonGlow.addColorStop(1, 'rgba(210, 220, 255, 0)');
            ctx.fillStyle = moonGlow;
            ctx.beginPath();
            ctx.arc(moonX, moonY, 70, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#dfe7ff';
            ctx.beginPath();
            ctx.arc(moonX, moonY, 32, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(190, 200, 230, 0.6)';
            ctx.beginPath();
            ctx.arc(moonX - 10, moonY - 6, 6, 0, Math.PI * 2);
            ctx.arc(moonX + 8, moonY + 10, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
            
            // Clouds
            for (var i = 0; i < this.clouds.length; i++) {
                var c = this.clouds[i];
                ctx.globalAlpha = c.opacity;
                ctx.fillStyle = mixColor('#ffffff', '#b0c4de', nightMix * 0.85);
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.6, c.y - c.size * 0.25, c.size * 0.7, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 1.1, c.y, c.size * 0.8, 0, Math.PI * 2);
                ctx.arc(c.x + c.size * 0.35, c.y + c.size * 0.35, c.size * 0.55, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // Back hills (furthest, lightest green) - rounded tops
            for (var i = 0; i < this.hillsBack.length; i++) {
                var h = this.hillsBack[i];
                var hillGrad = ctx.createLinearGradient(0, this.groundY - h.height, 0, this.groundY);
                hillGrad.addColorStop(0, mixColor('#a5d6a7', '#2b3f4b', nightMix));
                hillGrad.addColorStop(0.4, mixColor('#c8e6c9', '#3a5160', nightMix));
                hillGrad.addColorStop(1, mixColor('#e8f5e9', '#4b6374', nightMix));
                ctx.fillStyle = hillGrad;
                ctx.beginPath();
                ctx.moveTo(h.x - h.width/2, this.groundY);
                // Smooth rounded top using bezier curves
                ctx.bezierCurveTo(
                    h.x - h.width/3, this.groundY - h.height * 0.3,
                    h.x - h.width/5, this.groundY - h.height,
                    h.x, this.groundY - h.height
                );
                ctx.bezierCurveTo(
                    h.x + h.width/5, this.groundY - h.height,
                    h.x + h.width/3, this.groundY - h.height * 0.3,
                    h.x + h.width/2, this.groundY
                );
                ctx.fill();
            }
            
            // Mid hills (medium green) - rounded tops
            for (var i = 0; i < this.hillsMid.length; i++) {
                var h = this.hillsMid[i];
                var hillGrad = ctx.createLinearGradient(0, this.groundY - h.height, 0, this.groundY);
                hillGrad.addColorStop(0, mixColor('#81c784', '#1f3340', nightMix));
                hillGrad.addColorStop(0.4, mixColor('#a5d6a7', '#2e4452', nightMix));
                hillGrad.addColorStop(1, mixColor('#c8e6c9', '#3a5564', nightMix));
                ctx.fillStyle = hillGrad;
                ctx.beginPath();
                ctx.moveTo(h.x - h.width/2, this.groundY);
                ctx.bezierCurveTo(
                    h.x - h.width/3, this.groundY - h.height * 0.4,
                    h.x - h.width/6, this.groundY - h.height,
                    h.x, this.groundY - h.height
                );
                ctx.bezierCurveTo(
                    h.x + h.width/6, this.groundY - h.height,
                    h.x + h.width/3, this.groundY - h.height * 0.4,
                    h.x + h.width/2, this.groundY
                );
                ctx.fill();
            }
            
            // Front hills (closest, darkest green) - rounded tops
            for (var i = 0; i < this.hillsFront.length; i++) {
                var h = this.hillsFront[i];
                var hillGrad = ctx.createLinearGradient(0, this.groundY - h.height, 0, this.groundY);
                hillGrad.addColorStop(0, mixColor('#2e7d32', '#162a33', nightMix));
                hillGrad.addColorStop(0.4, mixColor('#43a047', '#203442', nightMix));
                hillGrad.addColorStop(1, mixColor('#66bb6a', '#2b4150', nightMix));
                ctx.fillStyle = hillGrad;
                ctx.beginPath();
                ctx.moveTo(h.x - h.width/2, this.groundY);
                ctx.bezierCurveTo(
                    h.x - h.width/3, this.groundY - h.height * 0.5,
                    h.x - h.width/6, this.groundY - h.height,
                    h.x, this.groundY - h.height
                );
                ctx.bezierCurveTo(
                    h.x + h.width/6, this.groundY - h.height,
                    h.x + h.width/3, this.groundY - h.height * 0.5,
                    h.x + h.width/2, this.groundY
                );
                ctx.fill();
            }
            
            // Top bar (ceiling) - same style as ground
            var ceilGrad = ctx.createLinearGradient(0, 0, 0, this.ceilingY);
            ceilGrad.addColorStop(0, mixColor('#64b5f6', '#1b2a4a', nightMix));
            ceilGrad.addColorStop(1, mixColor('#90caf9', '#2b3b63', nightMix));
            ctx.fillStyle = ceilGrad;
            ctx.fillRect(0, 0, canvas.width, this.ceilingY);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, this.ceilingY - 3);
            ctx.lineTo(canvas.width, this.ceilingY - 3);
            ctx.stroke();
            
            // Pipes
            for (var i = 0; i < this.pipes.length; i++) {
                this.renderPipe(this.pipes[i]);
            }
            
            // Ground
            var groundGrad = ctx.createLinearGradient(0, this.groundY, 0, canvas.height);
            groundGrad.addColorStop(0, mixColor('#90caf9', '#1e2f55', nightMix));
            groundGrad.addColorStop(1, mixColor('#64b5f6', '#172544', nightMix));
            ctx.fillStyle = groundGrad;
            ctx.fillRect(0, this.groundY, canvas.width, canvas.height - this.groundY);
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, this.groundY + 3);
            ctx.lineTo(canvas.width, this.groundY + 3);
            ctx.stroke();

            // Fireflies
            if (nightMix > 0.2) {
                for (var i = 0; i < this.fireflies.length; i++) {
                    var f = this.fireflies[i];
                    var glow = 0.4 + Math.sin(f.glow) * 0.4;
                    ctx.globalAlpha = glow * nightMix;
                    ctx.fillStyle = '#ffe08a';
                    ctx.beginPath();
                    ctx.arc(f.x, f.y, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }
            
            // Fart particles
            for (var i = 0; i < this.fartParticles.length; i++) {
                var p = this.fartParticles[i];
                ctx.globalAlpha = p.life * 0.6;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // Bird poops
            for (var i = 0; i < this.poops.length; i++) {
                var poop = this.poops[i];
                var px = poop.x;
                var py = poop.y;
                var ps = poop.size;
                var baseColor = '#f7f2e8';
                var edgeColor = '#e0d8cd';
                var highlightColor = '#ffffff';

                if (poop.landed) {
                    var splatW = poop.splatSize || ps * 2.2;
                    var splatH = ps * 0.8;
                    ctx.fillStyle = baseColor;
                    ctx.beginPath();
                    ctx.ellipse(px, py + ps * 0.15, splatW, splatH, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = edgeColor;
                    ctx.beginPath();
                    ctx.ellipse(px - splatW * 0.35, py + splatH * 0.15, ps * 0.8, ps * 0.35, 0, 0, Math.PI * 2);
                    ctx.ellipse(px + splatW * 0.3, py + splatH * 0.2, ps * 0.7, ps * 0.3, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = edgeColor;
                    ctx.lineWidth = 1.6;
                    ctx.beginPath();
                    ctx.moveTo(px - splatW * 0.15, py + splatH * 0.2);
                    ctx.quadraticCurveTo(px - splatW * 0.05, py + splatH * 1.3, px + splatW * 0.05, py + splatH * 1.5);
                    ctx.stroke();

                    ctx.fillStyle = highlightColor;
                    ctx.beginPath();
                    ctx.ellipse(px - splatW * 0.15, py - splatH * 0.1, ps * 0.4, ps * 0.2, -0.2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = baseColor;
                    ctx.beginPath();
                    ctx.ellipse(px, py, ps * 0.7, ps * 0.95, 0, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.beginPath();
                    ctx.moveTo(px, py - ps * 0.9);
                    ctx.quadraticCurveTo(px + ps * 0.6, py - ps * 0.1, px + ps * 0.15, py + ps * 0.8);
                    ctx.quadraticCurveTo(px - ps * 0.05, py + ps * 1.2, px - ps * 0.2, py + ps * 0.9);
                    ctx.closePath();
                    ctx.fill();

                    ctx.fillStyle = highlightColor;
                    ctx.beginPath();
                    ctx.ellipse(px - ps * 0.2, py - ps * 0.2, ps * 0.25, ps * 0.15, -0.3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
            
            // Hearts floating up
            for (var i = 0; i < this.hearts.length; i++) {
                var heart = this.hearts[i];
                ctx.globalAlpha = heart.life;
                ctx.fillStyle = '#ff6b9d';
                ctx.save();
                ctx.translate(heart.x, heart.y);
                ctx.scale(heart.size / 15, heart.size / 15);
                // Draw heart shape
                ctx.beginPath();
                ctx.moveTo(0, -5);
                ctx.bezierCurveTo(-8, -15, -15, -5, 0, 10);
                ctx.bezierCurveTo(15, -5, 8, -15, 0, -5);
                ctx.fill();
                // Highlight
                ctx.fillStyle = '#ff9dc4';
                ctx.beginPath();
                ctx.ellipse(-4, -6, 3, 2, -0.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.globalAlpha = 1;
            
            // Stars bursting
            for (var i = 0; i < this.stars.length; i++) {
                var star = this.stars[i];
                ctx.globalAlpha = star.life;
                ctx.fillStyle = '#ffd700';
                ctx.save();
                ctx.translate(star.x, star.y);
                ctx.rotate(star.rotation);
                // Draw 4-pointed star
                var s = star.size;
                ctx.beginPath();
                ctx.moveTo(0, -s);
                ctx.lineTo(s * 0.3, -s * 0.3);
                ctx.lineTo(s, 0);
                ctx.lineTo(s * 0.3, s * 0.3);
                ctx.lineTo(0, s);
                ctx.lineTo(-s * 0.3, s * 0.3);
                ctx.lineTo(-s, 0);
                ctx.lineTo(-s * 0.3, -s * 0.3);
                ctx.closePath();
                ctx.fill();
                // Inner glow
                ctx.fillStyle = '#fff8dc';
                ctx.beginPath();
                ctx.arc(0, 0, s * 0.3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.globalAlpha = 1;

            // Chirp notes
            for (var i = 0; i < this.chirps.length; i++) {
                var chirp = this.chirps[i];
                ctx.save();
                ctx.globalAlpha = chirp.life;
                ctx.translate(chirp.x, chirp.y);
                ctx.scale(chirp.scale, chirp.scale);
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -12);
                ctx.lineTo(6, -10);
                ctx.stroke();
                ctx.fillStyle = '#7fdbff';
                ctx.beginPath();
                ctx.arc(0, 2, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
            ctx.globalAlpha = 1;

            // Sparkles
            for (var i = 0; i < this.sparkles.length; i++) {
                var sp = this.sparkles[i];
                ctx.save();
                ctx.globalAlpha = sp.life;
                ctx.translate(sp.x, sp.y);
                ctx.rotate(sp.rotation);
                ctx.fillStyle = sp.color;
                var s = sp.size;
                ctx.beginPath();
                ctx.moveTo(0, -s);
                ctx.lineTo(s * 0.35, -s * 0.2);
                ctx.lineTo(s, 0);
                ctx.lineTo(s * 0.35, s * 0.2);
                ctx.lineTo(0, s);
                ctx.lineTo(-s * 0.35, s * 0.2);
                ctx.lineTo(-s, 0);
                ctx.lineTo(-s * 0.35, -s * 0.2);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
            ctx.globalAlpha = 1;
            
            // Regular particles
            for (var i = 0; i < this.particles.length; i++) {
                var p = this.particles[i];
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
            
            // Bird
            if (this.state !== 'menu') {
                var isBlinking = this.bird.blink > 200 && this.bird.blink < 210;
                if (this.bird.blink > 210) this.bird.blink = 0;
                
                ctx.save();
                ctx.translate(this.bird.x, this.bird.y);
                ctx.rotate(this.bird.rotation);
                
                // Add flip rotation (visual only)
                if (this.bird.flipping) {
                    ctx.rotate(this.bird.flipRotation);
                }
                
                var r = this.bird.radius;
                var wingAngle = Math.sin(this.bird.wingPhase) * 0.5 + this.bird.flapAnim * 0.6;
                
                // Wings
                ctx.save();
                ctx.translate(0, -r * 0.3);
                ctx.rotate(wingAngle - 0.3);
                drawCuteWing(ctx, r);
                ctx.restore();
                
                ctx.save();
                ctx.translate(0, r * 0.3);
                ctx.rotate(-wingAngle + 0.3);
                ctx.scale(1, -1);
                drawCuteWing(ctx, r * 0.9);
                ctx.restore();
                
                // Body
                var bodyGrad = ctx.createRadialGradient(-r * 0.2, -r * 0.2, 0, 0, 0, r);
                bodyGrad.addColorStop(0, '#ffffff');
                bodyGrad.addColorStop(0.6, '#f8fcff');
                bodyGrad.addColorStop(1, '#e0f0f8');
                ctx.fillStyle = bodyGrad;
                ctx.beginPath();
                ctx.arc(0, 0, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = '#b8d8e8';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Blush
                ctx.fillStyle = 'rgba(255, 180, 180, 0.3)';
                ctx.beginPath();
                ctx.ellipse(-r * 0.5, r * 0.25, r * 0.2, r * 0.12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(r * 0.5, r * 0.25, r * 0.2, r * 0.12, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Eyes
                drawCuteEye(ctx, -r * 0.32, -r * 0.1, r * 0.38, isBlinking);
                drawCuteEye(ctx, r * 0.32, -r * 0.1, r * 0.38, isBlinking);
                
                // Beak
                ctx.save();
                ctx.translate(r * 0.85, r * 0.05);
                var beakGrad = ctx.createLinearGradient(0, -4, 10, 0);
                beakGrad.addColorStop(0, '#ffb347');
                beakGrad.addColorStop(1, '#ff9500');
                ctx.fillStyle = beakGrad;
                ctx.beginPath();
                ctx.moveTo(0, -3);
                ctx.quadraticCurveTo(12, 0, 0, 3);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
                
                // Tuft
                ctx.save();
                ctx.translate(0, -r * 0.95);
                var tuftGrad = ctx.createLinearGradient(0, 0, 0, -10);
                tuftGrad.addColorStop(0, '#e0f0f8');
                tuftGrad.addColorStop(1, '#7fdbff');
                ctx.fillStyle = tuftGrad;
                ctx.beginPath();
                ctx.moveTo(-2, 0);
                ctx.quadraticCurveTo(-1, -8, 0, -10);
                ctx.quadraticCurveTo(1, -8, 2, 0);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
                
                ctx.restore();
            }
        },
        
        renderPipe: function(p) {
            var topH = p.gapY - p.gap/2 - this.ceilingY;
            var botY = p.gapY + p.gap/2;
            var botH = this.groundY - botY;
            var w = p.width;
            var capH = 25;
            var capW = w + 16;
            
            // Parse color to create variations
            var baseColor = p.color;
            
            // Top pipe
            this.drawPipe3D(p.x, this.ceilingY, w, topH, baseColor, true, capH, capW);
            
            // Bottom pipe
            this.drawPipe3D(p.x, botY, w, botH, baseColor, false, capH, capW);
        },
        
        drawPipe3D: function(x, y, width, height, color, isTop, capH, capW) {
            var bodyX = x - width/2;
            var capX = x - capW/2;
            
            // Darken/lighten color
            var darker = this.shadeColor(color, -30);
            var lighter = this.shadeColor(color, 30);
            
            // Pipe body gradient
            var bodyGrad = ctx.createLinearGradient(bodyX, 0, bodyX + width, 0);
            bodyGrad.addColorStop(0, darker);
            bodyGrad.addColorStop(0.2, color);
            bodyGrad.addColorStop(0.5, lighter);
            bodyGrad.addColorStop(0.8, color);
            bodyGrad.addColorStop(1, darker);
            
            ctx.fillStyle = bodyGrad;
            ctx.fillRect(bodyX, y, width, height);
            
            // Highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            ctx.fillRect(bodyX + width * 0.35, y, width * 0.12, height);
            
            // CALVEY INC. text vertically
            ctx.save();
            ctx.translate(x, y + height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.font = 'bold 12px "IBM Plex Mono", monospace';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (height > 80) {
                ctx.fillText('CALVEY INC.', 0, 0);
            }
            ctx.restore();
            
            // Cap
            var capY = isTop ? y + height - capH : y;
            var capGrad = ctx.createLinearGradient(capX, 0, capX + capW, 0);
            capGrad.addColorStop(0, darker);
            capGrad.addColorStop(0.15, color);
            capGrad.addColorStop(0.45, lighter);
            capGrad.addColorStop(0.85, color);
            capGrad.addColorStop(1, darker);
            
            ctx.fillStyle = capGrad;
            ctx.beginPath();
            ctx.roundRect(capX, capY, capW, capH, 4);
            ctx.fill();
            
            // Cap highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.fillRect(capX + capW * 0.32, capY + 4, capW * 0.15, capH - 8);
            
            // Glow on edge
            var glow = Math.sin(this.time * 0.05) * 0.2 + 0.8;
            ctx.shadowColor = color;
            ctx.shadowBlur = 10 * glow;
            ctx.strokeStyle = lighter;
            ctx.lineWidth = 2;
            var edgeY = isTop ? y + height : y;
            ctx.beginPath();
            ctx.moveTo(capX, edgeY);
            ctx.lineTo(capX + capW, edgeY);
            ctx.stroke();
            ctx.shadowBlur = 0;
        },
        
        shadeColor: function(color, percent) {
            var num = parseInt(color.replace('#', ''), 16);
            var amt = Math.round(2.55 * percent);
            var R = (num >> 16) + amt;
            var G = (num >> 8 & 0x00FF) + amt;
            var B = (num & 0x0000FF) + amt;
            R = Math.max(0, Math.min(255, R));
            G = Math.max(0, Math.min(255, G));
            B = Math.max(0, Math.min(255, B));
            return '#' + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1);
        }
    };
    
    // Initialize
    game.groundY = canvas.height - 60;
    game.init();
    
    // INPUT
    function handleTap(e) {
        if (e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT') return;
        if (e.target.closest('.leaderboard')) return; // Allow scrolling leaderboard
        if (e.type === 'touchstart') e.preventDefault();
        game.flap();
    }
    
    document.addEventListener('click', handleTap);
    document.addEventListener('touchstart', handleTap, { passive: false });
    document.addEventListener('keydown', function(e) {
        if (e.code === 'Space') {
            e.preventDefault();
            game.flap();
        }
    });
    
    // Game loop with delta time for consistent gameplay across devices
    function loop(currentTime) {
        // Calculate delta time (capped to prevent huge jumps)
        if (lastFrameTime === 0) lastFrameTime = currentTime;
        var elapsed = currentTime - lastFrameTime;
        lastFrameTime = currentTime;
        
        // Normalize to 60fps (deltaTime of 1 = 60fps, 2 = 30fps, etc)
        game.deltaTime = Math.min(elapsed / frameInterval, 3);
        
        game.update();
        game.render();
        requestAnimationFrame(loop);
    }
    
    requestAnimationFrame(loop);
</script>
