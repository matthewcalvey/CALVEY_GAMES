<style>

@media(max-height:520px) and (orientation:landscape) { .shell { padding:0 12px; } .mast { height:43px; } .wordmark { font-size:20px; } .mark { width:26px; } .utility { min-height:30px; } .foot { min-height:33px; } .primary { min-height:36px; padding:7px 16px; font-size:16px; } .launch { margin-top:9px; } .card { padding:15px 26px; } .card h2 { margin:6px 0; } .stats { margin:9px 0; padding:5px; } .card p { margin:6px 0 10px; } }

</style>

<script>
'use strict';
// Screen-printed harvest valley. Only the small visible strips are cached for parallax.
const { drawValley, drawGate } = (() => {
    const tau = Math.PI * 2;
    const ink = '#513e32';
    let scene;
    function rng(seed) {
        return () => {
            seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
            return seed / 4294967296;
        };
    }
    function polygon(c, points, fill, stroke, weight = 1) {
        c.beginPath();
        c.moveTo(points[0], points[1]);
        for (let j = 2; j < points.length; j += 2) c.lineTo(points[j], points[j + 1]);
        c.closePath();
        c.fillStyle = fill;
        c.fill();
        if (stroke) {
            c.strokeStyle = stroke;
            c.lineWidth = weight;
            c.stroke();
        }
    }
    function line(c, x1, y1, x2, y2, color, weight = 1) {
        c.beginPath();
        c.moveTo(x1,y1);
        c.lineTo(x2,y2);
        c.strokeStyle = color;
        c.lineWidth = weight;
        c.stroke();
    }
    function disk(c, x, y, radius, fill) {
        c.fillStyle = fill;
        c.beginPath();
        c.arc(x,y,radius,0,tau);
        c.fill();
    }
    function layer(width, height, y, density, draw) {
        const surface = document.createElement('canvas');
        surface.width = Math.ceil(width * density);
        surface.height = Math.ceil((height-y) * density);
        const c = surface.getContext('2d');
        c.scale(surface.width / width, surface.height / (height-y));
        c.translate(0,-y);
        c.lineJoin = 'round';
        c.lineCap = 'round';
        draw(c);
        return { surface, y, height: height-y };
    }
    function cloud(c,x,y,s) {
        c.save();c.translate(x,y);c.scale(s*1.42,s*1.42);
        const puff=new Path2D('M-43 7 C-54 5 -48 -8 -37 -8 Q-29 -26 -16 -18 C-9 -37 16 -32 20 -14 Q36 -20 41 -6 C57 -6 57 10 42 11 Q2 15 -43 7Z');
        c.fillStyle='#a2dfdc';c.translate(0,4);c.fill(puff);c.translate(0,-4);
        c.fillStyle='#fffdf0';c.fill(puff);c.restore();
    }
    function ridge(c,w,h,edge,fill,sample=6) {
        c.beginPath();
        c.moveTo(0,h+2);
        for (let i=0;i<w;i+=sample) c.lineTo(i,edge(i/w));
        c.lineTo(w,edge(1));
        c.lineTo(w,h+2);
        c.closePath();
        c.fillStyle = fill;
        c.fill();
    }
    function tree(c,x,y,s,colors,shape) {
        c.save();
        c.translate(x,y);
        c.scale(s,s);
        if (shape === 0) {
            polygon(c,[-.8,-.2,0,-20,1.2,-.2],colors[2]);
            for (let i=0;i<3;i++) {
                const yy = -29+i*6;
                const wd = 3.8+i*2.05;
                polygon(c,[0,yy,wd,yy+11,1,yy+9,-wd,yy+11],colors[0]);
                polygon(c,[0,yy,0,yy+9,-wd,yy+11],colors[1]);
            }
        } else {
            const wide = shape === 1 ? 8 : 11;
            c.beginPath();
            c.moveTo(0,-35);
            c.bezierCurveTo(wide*.35,-35,wide,-29,wide*.8,-25);
            c.bezierCurveTo(wide*1.35,-22,wide*1.3,-16,wide,-14);
            c.bezierCurveTo(wide*1.23,-6,wide*.32,-5,0,-7);
            c.bezierCurveTo(-wide*1.05,-6,-wide*1.2,-13,-wide,-16);
            c.bezierCurveTo(-wide*1.3,-20,-wide,-24,-wide*.72,-25);
            c.bezierCurveTo(-wide*.75,-29,-wide*.35,-35,0,-35);
            c.closePath();
            c.fillStyle = colors[0];
            c.fill();
            c.save();
            c.clip();
            polygon(c,[0,-36,wide*2,-36,wide*2,2,-1,2,1,-12,-1,-15,1,-20,-1.5,-24,.9,-30],colors[1]);
            c.restore();

    function paintLayer(c,bitmap,width,w,shift) {

        for(let x=-(wrapped%width); x<w; x+=width,index++){
            c.save();
            c.translate(x+(index%2 ? width : 0),0);
            if(index%2) c.scale(-1,1);

    // Painted behind the gate silhouettes so weather never conceals a playable gap.
    function flightSky(c,w,h,time,scroll,index) {
        const skies=[
            ['#61cce7','#c9ffdd'],['#42b5d7','#ffed9b'],['#5964ac','#f4d6e4'],
            ['#a2519f','#ffae70'],['#342b72','#e879a0'],['#131e50','#5850a2'],
            ['#142653','#457b98'],['#7d61be','#ffd586']

                const radius=u*(i%7===0?2.1:1.1);

            }

            disc(w*.76+8*u,h*.25+5*u,4*u,'#e4c999');

                c.strokeStyle=color;c.lineWidth=4.5*u;c.stroke();});
        }

            for(let j=0;j<3;j++){
                c.beginPath();
                for(let i=0;i<=48;i++){
                    const x=i*w/48,y=h*(.16+j*.07+.055*Math.sin(i*.13+time*.25+j));
                    if(i===0)c.moveTo(x,y);else c.lineTo(x,y);

                c.beginPath();c.ellipse(0,0,5,15,0,0,tau);c.fill();c.fillStyle='#945438';c.fillRect(-6,20,12,7);c.restore();

    function drawValley(c,w,h,time,scroll,mode) {
        if(w<=0 || h<=0) return;
        if(!scene || scene.w!==w || scene.h!==h) scene=build(w,h);
        const W=scene.width;
        const crop=(W-w)*.67;
        const travel=Number.isFinite(scroll)?scroll:0;
        c.save();
        paintLayer(c,scene.sky,W,w,crop+travel*.025);
        if(mode==='play' && skyLevel>0){
            const layer=Math.floor(skyLevel), fraction=skyLevel-layer;
            const phase=n=>1+(n-1)%7;
            const t=reducedMotion.matches?0:time;
            if(layer>0) flightSky(c,w,h,t,travel,phase(layer));
            if(fraction>0){
                c.save();c.globalAlpha=fraction;
                flightSky(c,w,h,t,travel,phase(layer+1));c.restore();
            }
        }
        // Small distant geese animate independently of the illustrated background plates.
        const birds=[[.20,.45,0],[.214,.442,1.1],[.228,.448,.4],[.86,.20,2],[.88,.191,.4]];
        const unit=Math.min(h/800,W/1200);
        for(const [bx,by,offset] of birds) {
            const x=((bx*W+time*(1.1+offset*.13)*unit-travel*.052)%W+W)%W-crop;
            const y=by*h+Math.sin(time*.35+offset)*unit, tip=(.65+.45*Math.sin(time*2+offset))*2.6*unit;
            c.beginPath(); c.moveTo(x-4.7*unit,y-tip); c.quadraticCurveTo(x-1.6*unit,y-tip*.9,x,y);
            c.quadraticCurveTo(x+2.1*unit,y-tip,x+4.9*unit,y-tip*.9);
            c.strokeStyle='#a79270'; c.lineWidth=Math.max(.85,1.28*unit); c.stroke();
        }
        paintLayer(c,scene.hills,W,w,crop+travel*.073);
        paintLayer(c,scene.fields,W,w,crop+travel*.205);
        paintLayer(c,scene.fore,W,w,crop+travel*.43);
        if(mode==='play' && skyLevel>0){
            const shades=[0,0,.08,.12,.32,.46,.34,.04];
            const n=Math.floor(skyLevel), f=skyLevel-n;
            const shade=k=>k===0?0:shades[1+(k-1)%7];
            c.fillStyle='rgba(42,26,81,'+((1-f)*shade(n)+f*shade(n+1))+')';
            c.fillRect(0,0,w,h);
        }
        c.restore();
    }
    function drawGate(c,x,w,topEnd,bottomStart,h,time) {

        c.save(); c.translate(x,0);
        c.lineCap='round'; c.lineJoin='round';
        const band=w*.15;
        function beam(y,length,hanging) {
            if(length<=0) return;
            c.save();
            c.beginPath(); c.rect(0,y,w,length); c.clip();
            const left=w*.105,right=w*.895;
            c.fillStyle=ink;
            c.fillRect(left,y,right-left,length);
            c.fillStyle=hanging?'#9e5537':'#bd7441';
            c.fillRect(left+1.8,y,right-left-3.6,length);
            for(let j=0;j<4;j++){
                const xx=left+(right-left)*(j+.5)/4;
                line(c,xx,y,xx,y+length,hanging?'#ad6441':'#cb8550',2);
                if(j<3) line(c,xx+(right-left)/8,y,xx+(right-left)/8,y+length,hanging?'#724936':'#8b5839',1);
            }
            const unit=w*1.15;
            const cap=hanging?y+length:y;
            const direction=hanging?-1:1;
            for(let j=0;j<Math.ceil(length/unit);j++){
                const a=cap+direction*(w*.42+j*unit), b=a+direction*(unit-band*.9);
                polygon(c,[left+2,a,right-2,b-direction*band*.77,right-2,b,left+2,a+direction*band*.77],hanging?'#ca8650':'#dea35d','#724f3b',1.1);
                c.fillStyle=ink; c.fillRect(left,a-band*.36,right-left,band*.91);
                c.fillStyle=hanging?'#c17e50':'#d69652'; c.fillRect(left+1,a-band*.36+1,right-left-2,band*.91-2);
                disk(c,left+4,a+band*.09,1.05,'#6e503b'); disk(c,right-4,a+band*.09,1.05,'#6e503b');
            }
            if(hanging){
                // Banner pennants hang between the low brace and the lintel, inside the gate.
                const y0=cap-w*.49;
                for(let j=0;j<4;j++){
                    const xx=w*(.12+j*.19);
                    polygon(c,[xx,y0,xx+w*.19,y0,xx+w*.105,y0+w*.22],['#ebbd71','#b9563f','#d9984d','#718064'][j],'#704b38',1);
                }
                c.fillStyle='#654632'; c.fillRect(w*.045,cap-w*.22,w*.91,w*.22);
                c.fillStyle='#be7240'; c.fillRect(w*.045+1.5,cap-w*.22+1.6,w*.91-3,w*.22-3.1);
                line(c,w*.09,cap-w*.16,w*.91,cap-w*.16,'#e4a45e',1.4);
            } else {
                // Gold produce basket with foreground pumpkins and a slatted rim.
                const base=cap+w*.33;
                c.fillStyle='#614f36'; c.fillRect(w*.065,cap+w*.035,w*.87,w*.34);
                pumpkin(c,w*.30,base-.07*w,w*.022);
                pumpkin(c,w*.55,base-.095*w,w*.026);
                pumpkin(c,w*.76,base-.06*w,w*.018);
                c.fillStyle='#705239'; c.fillRect(w*.035,base-w*.05,w*.93,w*.17);
                c.fillStyle='#e1a95e'; c.fillRect(w*.035+1.4,base-w*.05+1.5,w*.93-2.8,w*.17-3);
                line(c,w*.08,base+w*.005,w*.92,base+w*.005,'#f1c582',1);
            }
            c.restore();
        }
        beam(0,topEnd,true);
        beam(bottomStart,h-bottomStart,false);
        c.restore();
    }
    return { drawValley, drawGate };
})();

// A little round Calvey bird, dressed in a turkey's autumn plumage.
function drawTurkey(c,x,y,scale,pose) {
  const t=pose.time, beat=Math.sin(pose.flap), ink='#673523';
  c.save(); c.translate(x,y); c.rotate(pose.tilt); c.scale(scale,scale);
  const squash=.04*beat;
  c.scale(1+squash,1-squash);
  c.lineCap='round'; c.lineJoin='round';
  function oval(x,y,rx,ry,fill,stroke=ink,weight=3,angle=0) {
    c.beginPath(); c.ellipse(x,y,rx,ry,angle,0,Math.PI*2);
    c.fillStyle=fill; c.fill();
    if(stroke){ c.strokeStyle=stroke; c.lineWidth=weight; c.stroke(); }
  }
  function shape(data,fill,edge=ink,width=3) {
    const path=new Path2D(data);
    if(fill){c.fillStyle=fill;c.fill(path);}
    if(edge){c.strokeStyle=edge;c.lineWidth=width;c.stroke(path);}
  }
  // Rounded candy-corn tips peek out behind the chestnut body.
  const feathers=['#e35538','#ff913f','#ca5530','#ffc457','#ed6432'];
  for(let i=0;i<5;i++) {
    c.save(); c.translate(-36,8); c.rotate(-1.78+i*.326+(i-2)*.051*beat+.04*Math.sin(t*4+i*.7));
    oval(0,-39,13.4,40,feathers[i]);
    shape('M-11 -59 Q-1 -51 11 -60 Q12 -64 10 -68 Q0 -60 -10 -68 Z','#ffe495',null);
    shape('M0 -15 Q-2 -29 0 -49',null,'#ae5830',2);
    c.restore();
  }
  // Two small feet paddle under the belly.
  for(const [fx,fy,phase] of [[-24,54,0],[10,56,2]]) {
    c.save(); c.translate(fx,fy); c.rotate(.36*Math.sin(t*7+phase)+beat*.12);
    shape('M-2 -3 Q2 -3 4 2 L3 9 Q11 12 7 15 Q4 17 -1 12 Q-5 18 -8 15 Q-10 13 -5 9 Z','#ffa52f');
    c.restore();
  }
  const body=c.createRadialGradient(-23,-32,4,2,4,73);
  body.addColorStop(0,'#ffc47b'); body.addColorStop(.52,'#eda25c'); body.addColorStop(.84,'#cd733d'); body.addColorStop(1,'#ac5735');
  oval(0,0,72,66,body,ink,4);
  shape('M-37 39 Q-18 54 8 54 Q26 54 39 46',null,'#e99653',3);
  // Little feather crest and tiny paddle-shaped wing.
  shape('M-21 -61 C-32 -69 -35 -80 -29 -80 Q-22 -80 -13 -70 C-18 -86 -9 -88 -4 -78 Q-1 -71 0 -65','#f4a65d');
  c.save(); c.translate(-45,12); c.rotate(-.24+1.05*beat); c.scale(1.22,1+.18*beat);
  shape('M3 -5 C-4 -12 -16 -17 -21 -13 Q-25 -9 -18 -4 Q-27 -7 -25 -1 Q-24 4 -16 6 Q-22 7 -17 12 C-9 17 3 9 5 4','#bc653c');
  shape('M-15 -8 Q-12 -4 -7 -3',null,'#ffd18a',2.6); c.restore();
  // Downy cream eye surrounds and chocolate button eyes, like the original bird.
  for (const [ex,ey,rx,ry] of [[8,-19,19,24],[46,-20,17,22]]) {
    if(pose.blink){shape('M'+(ex-rx*.65)+' '+ey+'q10 -9 '+(rx*1.3)+' 0',null,ink,4);continue;}
    oval(ex,ey,rx,ry,'#fffbee',ink,2.6);
    oval(ex+4,ey+2,rx*.57,ry*.67,'#40291f',null);
    oval(ex+1,ey-4,4.4,5.3,'#fff',null);
    oval(ex+8,ey+6,2.1,2.3,'#ffedc8',null);
  }
  oval(-11,7,11,6,'#f58b77',null,0,-.09);
  oval(57,3,8,4.5,'#fa9d81',null);
  // The free end lags behind the turkey's body. Flaps add an impulse to its spring.
  c.save(); c.translate(50,8); c.rotate(pose.wattle);
  shape('M-4 -3 C-7 7 2 15 -1 23 C-4 31 -8 38 -2 44 C4 51 16 46 18 38 C22 25 9 19 8 8 Q8 -4 -4 -3 Z','#ef5353','#903637',2.8);
  shape('M4 27 Q-2 36 3 39',null,'#ffaaa0',3); c.restore();
  shape('M31 -1 Q43 -11 61 -4 Q66 -1 60 3 Q49 15 41 11 Q35 9 31 -1 Z','#ffbc36');
  shape('M35 1 Q47 5 58 0',null,'#b06b28',1.9);
  c.restore();
}

// The instrument sounds and wingbeats are synthesized locally on the first user gesture.
const HarvestAudio = (() => {
    let context, output, featherNoise, turkeyVoice;
    let muted = false;
    const lastPlayed = new Map();

    function unlock() {
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return;
        try {
            if (!context) {
                context = new Context();
                output = context.createGain();
                output.gain.value = muted ? 0 : 0.58;
                output.connect(context.destination);

                featherNoise = context.createBuffer(1, Math.ceil(context.sampleRate * 0.14), context.sampleRate);
                const samples = featherNoise.getChannelData(0);
                for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;
                turkeyVoice = context.createPeriodicWave(new Float32Array(8),
                    new Float32Array([0, 0.8, 0.31, 0.26, 0.17, 0.06, 0.08, 0.025]));
            }
            if (context.state !== 'running') {
                const resuming = context.resume();
                if (resuming) resuming.catch(() => {});
            }
        } catch (_) {
            // Flight is still available in browsers without usable Web Audio.
        }
    }

    function setMuted(value) {
        muted = Boolean(value);
        if (output) output.gain.setTargetAtTime(muted ? 0 : 0.58, context.currentTime, 0.006);
    }

    function note(when, pitch, duration, loudness, wave = 'sine', endPitch = pitch, attack = 0.01) {
        const oscillator = context.createOscillator();
        const envelope = context.createGain();
        if (typeof wave === 'string') oscillator.type = wave;
        else oscillator.setPeriodicWave(wave);
        oscillator.frequency.setValueAtTime(pitch, when);
        oscillator.frequency.exponentialRampToValueAtTime(endPitch, when + duration);
        envelope.gain.setValueAtTime(0.0001, when);
        envelope.gain.exponentialRampToValueAtTime(loudness, when + attack);
        envelope.gain.exponentialRampToValueAtTime(0.0001, when + duration);
        oscillator.connect(envelope);
        envelope.connect(output);
        oscillator.start(when);
        oscillator.stop(when + duration + 0.01);
    }

    function wingbeat(when) {
        const noise = context.createBufferSource();
        const filter = context.createBiquadFilter();
        const gain = context.createGain();
        noise.buffer = featherNoise;
        noise.playbackRate.value = 0.93 + Math.random() * 0.14;
        filter.type = 'bandpass';
        filter.Q.value = 0.75;
        filter.frequency.setValueAtTime(3200, when);
        filter.frequency.exponentialRampToValueAtTime(850, when + 0.103);
        gain.gain.setValueAtTime(0.0001, when);
        gain.gain.exponentialRampToValueAtTime(0.27, when + 0.016);
        gain.gain.exponentialRampToValueAtTime(0.018, when + 0.038);
        gain.gain.exponentialRampToValueAtTime(0.13, when + 0.058);
        gain.gain.exponentialRampToValueAtTime(0.0001, when + 0.115);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(output);
        noise.start(when);
        noise.stop(when + 0.127);
    }

    function gobble(when) {
        const pitch = 470 + Math.random() * 33;
        const voice = context.createOscillator();
        const throat = context.createBiquadFilter();
        const volume = context.createGain();
        voice.setPeriodicWave(turkeyVoice);
        throat.type = 'bandpass';
        throat.Q.value = 1;
        throat.frequency.value = 1280;
        voice.connect(throat);
        throat.connect(volume);
        volume.connect(output);
        volume.gain.setValueAtTime(0.0001, when);
        // A pair of short pickup syllables followed by a rapidly bubbling, descending call.
        const syllables = [
            [0, 1.32, 0.048], [0.076, 1.52, 0.052], [0.157, 1.24, 0.038],
            [0.206, 1.38, 0.038], [0.254, 1.27, 0.034], [0.297, 1.15, 0.032],
            [0.338, 1.12, 0.031], [0.378, 1.04, 0.047]
        ];
        for (const [offset, ratio, length] of syllables) {
            const at = when + offset;
            voice.frequency.setValueAtTime(pitch * ratio * 0.84, at);
            voice.frequency.exponentialRampToValueAtTime(pitch * ratio * 1.18, at + 0.012);
            voice.frequency.exponentialRampToValueAtTime(pitch * ratio * 0.73, at + length);
            throat.frequency.setValueAtTime(940 * ratio, at);
            throat.frequency.exponentialRampToValueAtTime(1510 * ratio, at + length * 0.55);
            volume.gain.setValueAtTime(0.0001, at);
            volume.gain.exponentialRampToValueAtTime(0.37, at + 0.007);
            volume.gain.exponentialRampToValueAtTime(0.0001, at + length);
        }
        voice.start(when);
        voice.stop(when + 0.44);
    }

    function pluck(when, pitch, strength) {
        note(when, pitch, 0.36, strength, 'triangle', pitch * 0.999, 0.004);
        note(when + 0.007, pitch * 1.004, 0.22, strength * 0.45, 'sine', pitch, 0.003);
        note(when, pitch * 2, 0.09, strength * 0.35, 'sine', pitch * 2, 0.003);
    }

    function play(name) {
        if (muted || !output || context.state === 'closed') return;
        const when = context.currentTime + 0.003;
        const minGap = name === 'flap' ? 0.08 : name === 'gobble' ? 0.65 : 0.075;
        if (when - (lastPlayed.get(name) ?? -10) < minGap) return;
        lastPlayed.set(name, when);
        switch (name) {
            case 'flap': wingbeat(when); break;
            case 'gobble': gobble(when); break;
            case 'score':
                pluck(when, 523.25, 0.20);
                pluck(when + 0.075, 783.99, 0.15);
                break;
            case 'pie':
                note(when, 1330, 0.58, 0.16);
                note(when, 3202, 0.22, 0.044);
                note(when + 0.15, 1675, 0.53, 0.13);
                note(when + 0.15, 3970, 0.22, 0.035);
                break;
            case 'harvest':
                [392, 493.88, 587.33, 783.99, 659.25, 783.99].forEach((hz, i) => {
                    const at = when + i * 0.093;
                    pluck(at, hz, 0.17);
                    if (i === 3 || i === 5) pluck(at + 0.014, hz * 0.5, 0.12);
                });
                break;
            case 'land':
                [587.33, 523.25, 392].forEach((hz, i) => pluck(when + i * 0.109, hz, 0.145));
                break;
        }
    }
    return { unlock, setMuted, play };
})();

const HarvestEffects = (() => {
    const particles = [];
    const colors = ['#b74e32', '#d89538', '#e7ba62', '#8d4930'];
    const ink = '#502f25';
    const counts = { feathers: 3, leaves: 6, cranberries: 5, pie: 1, harvest: 20 };
    const range = (a, b) => a + (b - a) * Math.random();

    function clear() { particles.length = 0; }

    function burst(kind, x, y, scale = 1) {
        const count = counts[kind];
        if (!count || !(scale > 0)) return;
        const extra = particles.length + count - 160;
        if (extra > 0) particles.splice(0, extra);
        for (let i = 0; i < count; i++) {
            const shape = kind === 'harvest' ? ['leaves', 'seeds', 'cranberries', 'seeds'][i % 4] : kind;
            const fan = kind === 'harvest';
            const light = shape === 'leaves' || shape === 'feathers' || shape === 'seeds';
            const size = shape === 'pie' ? 15 : shape === 'cranberries' ? range(4, 6) : range(4.5, 8);
            particles.push({
                shape, x: x + range(-4, 4) * scale, y: y + range(-4, 4) * scale, size: size * scale,
                color: colors[Math.floor(range(0, colors.length))],
                vx: (fan ? range(-140, 145) : shape === 'pie' ? range(-18, 12) : range(-105, 15)) * scale,
                vy: (fan ? range(-165, 20) : shape === 'pie' ? -70 : range(-74, 14)) * scale,
                gravity: (light ? range(22, 54) : range(165, 220)) * scale,
                drift: light ? range(11, 24) * scale : 0, phase: range(0, 6.28),
                angle: shape === 'pie' ? -0.1 : range(-2.9, 2.9),
                spin: shape === 'pie' ? range(-1.1, 1.1) : range(-3.5, 3.5),
                life: shape === 'feathers' ? range(0.42, 0.68) : range(1.1, 1.7),
                age: 0
            });
        }
    }

    function update(dt, scrollSpeed = 0) {
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.age += dt;
            if (p.age >= p.life || p.x < -50) {
                particles.splice(i, 1);
                continue;
            }
            p.x += (p.vx + Math.sin(p.phase + p.age * 6) * p.drift - scrollSpeed * 0.72) * dt;
            p.y += p.vy * dt;
            p.vy += p.gravity * dt;
            p.angle += p.spin * dt;
        }
    }

    function leaf(c, color) {
        c.fillStyle = color;
        c.beginPath();
        c.moveTo(0.05, 0.8);
        c.lineTo(-0.85, 0.22); c.lineTo(-0.64, 0.03); c.lineTo(-0.97, -0.46);
        c.lineTo(-0.38, -0.3); c.lineTo(-0.25, -0.7); c.lineTo(-0.07, -0.55);
        c.lineTo(0.12, -1.14); c.lineTo(0.39, -0.5); c.lineTo(0.63, -0.69);
        c.lineTo(0.59, -0.22); c.lineTo(0.99, -0.31); c.lineTo(0.77, 0.11);
        c.lineTo(0.92, 0.16); c.closePath();
        c.fill(); c.stroke();
        c.beginPath(); c.moveTo(-0.1, 1.13); c.quadraticCurveTo(0.13, 0.53, 0.11, -0.43); c.stroke();
    }

    function feather(c) {
        c.fillStyle = '#eac788';
        c.beginPath(); c.moveTo(-1.12, 0.58);
        c.quadraticCurveTo(-0.62, -0.56, 0.86, -0.65);
        c.quadraticCurveTo(0.96, 0.02, 0.43, 0.22);
        c.lineTo(0.32, 0.15); c.quadraticCurveTo(-0.18, 0.65, -1.12, 0.58);
        c.fill(); c.stroke();
        c.beginPath(); c.moveTo(-1.25, 0.7); c.lineTo(0.59, -0.43); c.stroke();
    }

    function berry(c) {
        c.fillStyle = '#ac383b';
        c.beginPath(); c.arc(0, 0, 0.82, 0, Math.PI * 2); c.fill(); c.stroke();
        c.fillStyle = '#f5c797';
        c.beginPath(); c.ellipse(-0.24, -0.27, 0.23, 0.12, -0.65, 0, Math.PI * 2); c.fill();
        c.beginPath(); c.moveTo(0.17, -0.65); c.quadraticCurveTo(0.52, -0.78, 0.43, -1.08); c.stroke();
    }

    function pie(c) {
        // Pumpkin filling, fluted crust, and a dollop of whipped cream.
        c.fillStyle = '#bf6238'; c.beginPath(); c.moveTo(-1.14, 0); c.lineTo(0.77, -0.55);
        c.lineTo(1.11, -0.08); c.lineTo(0.94, 0.44); c.lineTo(-1.02, 0.38); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = '#e9ad57'; c.beginPath(); c.moveTo(-1.03, 0.18); c.lineTo(0.97, 0.23);
        c.lineTo(1.01, 0.42); c.lineTo(-1, 0.43); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = '#f2ce8c'; c.beginPath(); c.moveTo(0.66,-0.49);
        c.quadraticCurveTo(0.73,-0.79,0.87,-0.53); c.quadraticCurveTo(1.05,-0.61,1.03,-0.37);
        c.quadraticCurveTo(1.28,-0.40,1.10,-0.10); c.closePath(); c.fill(); c.stroke();
        c.fillStyle = '#fff0d1'; c.beginPath(); c.moveTo(-0.27,-0.17);
        c.quadraticCurveTo(-0.42,-0.40,-0.13,-0.51); c.quadraticCurveTo(-0.03,-0.58,-0.08,-0.73);
        c.quadraticCurveTo(0.41,-0.56,0.36,-0.31); c.quadraticCurveTo(0.14,-0.12,-0.27,-0.17); c.fill(); c.stroke();
    }

    function draw(c) {
        c.save();
        c.lineJoin = 'round'; c.lineCap = 'round'; c.strokeStyle = ink;
        const originalAlpha = c.globalAlpha;
        for (const p of particles) {
            c.save(); c.translate(p.x, p.y); c.rotate(p.angle);
            const flutter = p.shape === 'leaves' ? 0.75 + 0.25 * Math.cos(p.phase + p.age * 5) : 1;
            c.scale(p.size * flutter, p.size);
            c.globalAlpha = originalAlpha * Math.min(1, (p.life - p.age) / (p.life * 0.28));
            c.lineWidth = p.shape === 'pie' ? 0.08 : 0.125;
            if (p.shape === 'leaves') leaf(c, p.color);
            else if (p.shape === 'feathers') feather(c);
            else if (p.shape === 'cranberries') berry(c);
            else if (p.shape === 'pie') pie(c);
            else {
                c.fillStyle = '#edbf66';
                c.beginPath(); c.ellipse(0, 0, 0.34, 0.75, 0, 0, Math.PI * 2);
                c.fill(); c.stroke();
            }
            c.restore();
        }
        c.restore();
    }

    return { clear, burst, update, draw };
})();

<script>
'use strict';

  try { return (JSON.parse(read(scoreKey)) || []).filter(f => f && Number.isFinite(f.score) && Number.isFinite(f.distance) && Number.isFinite(f.date)).sort(rankFlights); }
  catch { return []; }
}
let flights=getHistory(), lastFlight=null;
let playerId=read('calveybird_id') || uniqueId();
let muted=(read('calveybird_thanksgiving_sound') || read('calveybird_sound'))==='off';
save('calveybird_id',playerId);

}

  if (!muted) HarvestAudio.play('gobble');

let w=0,h=0,unit=1,dpr=1,portrait=false;
let state='menu', clock=0, previousFrame=0, elapsed=0, distance=0, travel=0;
let score=0, flaps=0, celebrationLeft=0, landingLeft=0, lastGobble=0, nextDrop=0, drops=0;
let gates=[],skyLevel=0;
const skyNames=['Balloon meadow','Rainbow shower','Peach sunset','Firefly hour','Shooting stars','Aurora valley','Rainbow sunrise'];
const bird={x:0,y:0,vy:0,tilt:0,wing:0,spin:0,wattle:0,wattleSpeed:0};
function resize() {
  const oldH=h, oldUnit=unit, oldX=bird.x;
  w=Math.max(1,stage.clientWidth); h=Math.max(1,stage.clientHeight);
  unit=clamp(h/650,.40,1.65);
  dpr=Math.min(window.devicePixelRatio || 1,2);
  canvas.width=Math.round(w*dpr); canvas.height=Math.round(h*dpr);
  ctx.setTransform(canvas.width/w,0,0,canvas.height/h,0,0);
  portrait=w/h<=.9;
  // The button stays under the copy on desktop, and under the bird on a tall poster.
  const parent=portrait?$('intro'):document.querySelector('.intro-copy');
  if ($('desktopLaunch').parentElement!==parent) parent.append($('desktopLaunch'));
  bird.x=clamp(w*.25,46*unit,Math.max(65*unit,w*.31));
  if (oldH) {
    bird.y*=h/oldH; bird.vy*=unit/oldUnit;
    for (const g of gates) { g.x=bird.x+(g.x-oldX)*unit/oldUnit; g.center*=h/oldH; g.gap*=h/oldH; }
  }
  if (state==='ready' || state==='flying') fillGates();
  render();
}

const printedLeaf=new Path2D('M0 -14 L3 -6 L6 -8 L6 -3 L13 -6 L11 0 L14 0 L5 6 L7 8 L1 8 L0 13 L-1 13 L-1 7 L-8 8 L-6 5 L-14 0 L-11 -1 L-12 -6 L-6 -4 L-6 -8 L-3 -6 Z');
const leafSites=[[.505,.135,.8,-.7],[.555,.34,1.1,-1.15],[.86,.115,.75,.5],[.925,.47,1,-.5],[.55,.55,.60,1.35],[.86,.615,.7,-.95]];
function autumnLeaf(x,y,size,angle,color) {
  ctx.save(); ctx.translate(x,y); ctx.rotate(angle); ctx.scale(size,size);
  ctx.fillStyle=color; ctx.strokeStyle='#855436'; ctx.lineJoin='round'; ctx.lineWidth=.9;
  ctx.fill(printedLeaf); ctx.stroke(printedLeaf); ctx.beginPath(); ctx.moveTo(0,8); ctx.lineTo(0,-8);
  ctx.moveTo(0,4); ctx.lineTo(-7,0); ctx.moveTo(0,2); ctx.lineTo(7,-1); ctx.stroke(); ctx.restore();
}
// Squashy pumpkins sit on the front edge of the title scene.
function pumpkinPals(t) {
  function pumpkin(x,y,size,color,lean) {
    ctx.save();ctx.translate(x,y);ctx.scale(size,size);ctx.rotate(lean);
    const ink='#773e2b';
    function oval(x,y,rx,ry,fill,stroke) {
      ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);ctx.fillStyle=fill;ctx.fill();
      if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2.5;ctx.stroke();}
    }
    const stem=new Path2D('M-3 -20 Q-5 -29 1 -34 L7 -32 Q2 -27 5 -20 Z');
    ctx.fillStyle='#698839';ctx.fill(stem);ctx.strokeStyle=ink;ctx.lineWidth=2.5;ctx.stroke(stem);
    oval(-11,0,16,20,color,ink);oval(11,0,16,20,color,ink);
    oval(0,0,15,22,color,ink);
    for(const side of [-1,1]) {
      oval(side*8,-1,2.4,3.3,ink);oval(side*14,4,3.6,2,'#ff9b78');
    }
    ctx.beginPath();ctx.moveTo(-3,4);ctx.quadraticCurveTo(0,8,3,4);ctx.stroke();
    ctx.restore();
  }
  const s=clamp(Math.min(w/720,h/480),.65,2.25);
  pumpkin(31*s,h-12*s,s*1.3,'#ff922f',-.13+.035*Math.sin(t*1.8));
  pumpkin(84*s,h-8*s,s*.84,'#ffc24d',.14);
  pumpkin(w-32*s,h-10*s,s*1.18,'#ff933a',.11-.04*Math.sin(t*1.8));
}

function titleArt(t) {
  const x=w*(portrait?.53:.715), y=h*(portrait?.46:.383);
  const radius=portrait?Math.min(w*.288,h*.171):Math.min(w*.146,h*.251);
  ctx.save(); ctx.translate(x,y);
  const sun=ctx.createRadialGradient(-radius*.23,-radius*.36,radius*.08,0,0,radius);
  sun.addColorStop(0,'#fff9ad'); sun.addColorStop(1,'#ffce57');
  ctx.beginPath();ctx.arc(0,0,radius,0,TAU);ctx.fillStyle=sun;ctx.fill();
  ctx.strokeStyle='#fff6b2';ctx.lineWidth=radius*.046;ctx.stroke();
  ctx.lineCap='round';ctx.lineWidth=radius*.034;
  for(let i=0;i<18;i++) {
    const a=TAU*i/18, r=radius*1.12, end=r+radius*(.055+.022*Math.sin(t*2+i));
    ctx.beginPath();ctx.moveTo(Math.cos(a)*r,Math.sin(a)*r);ctx.lineTo(Math.cos(a)*end,Math.sin(a)*end);ctx.stroke();
  }
  ctx.restore();
  const bob=Math.sin(t*1.55)*(portrait?3:5), turkeyScale=radius*(portrait?.0092:.00985);
  // Curved slipstream strokes travel with the turkey's tail.
  ctx.save(); ctx.translate(x-radius*1.02,y+radius*.26+bob); ctx.scale(radius/140,radius/140);
  ctx.lineCap='round'; ctx.strokeStyle='#a97743'; ctx.lineWidth=1.5;
  for (const [dx,dy,len] of [[-4,0,65],[-1,9,45],[-13,-11,34]]) {
    ctx.beginPath(); ctx.moveTo(dx,dy); ctx.quadraticCurveTo(dx-len*.58,dy+5,dx-len,dy+4); ctx.stroke();
  }
  ctx.restore();
  drawTurkey(ctx,x+radius*.03,y+bob,turkeyScale,{time:t,wattle:.17+.57*Math.sin(t*4.7-.9),flap:t*4.7+.6,tilt:-.055+Math.sin(t*1.23)*.024,blink:t%4.2>4.03});
  pumpkinPals(t);
  const mobileLeaves=[[.12,.34,.7,-.7],[.11,.55,.8,-.9],[.80,.29,.58,.65],[.91,.56,.82,.6]];
  (portrait?mobileLeaves:leafSites).forEach(([lx,ly,z,angle],i) => {
    const drift=Math.sin(t*.57+i)*5;
    autumnLeaf(w*lx+drift,h*ly+Math.cos(t*.55+i)*4,z*clamp(radius/150,.62,1.35),angle+drift*.034,['#f16d40','#f1a537','#e8583e'][i%3]);
  });
}

function addGate(x,isFirst=false) {
  // Both base games vary the gap and increase scrolling speed every ten clearances.
  const roll=Math.random();
  const gapUnits=isFirst?228:roll<.25?154+Math.random()*22:roll<.60?177+Math.random()*26:199+Math.random()*26;
  const gap=Math.min(gapUnits*unit,h*.52);
  const min=h*.085+gap/2,max=h*.91-gap/2;
  const last=gates.at(-1);
  const center=isFirst?h*.48:clamp((last?.center || h*.5)+(Math.random()-.5)*260*unit,min,max);
  gates.push({x,center,gap,passed:false});
}
function fillGates() {
  if (!gates.length) addGate(bird.x+Math.min(390*unit,w*.78),true);
  const spacing=319*unit;
  while (gates.at(-1).x<w+spacing) addGate(gates.at(-1).x+spacing);
}
function launch() {
  HarvestAudio.unlock(); HarvestEffects.clear();
  skyLevel=0; score=flaps=elapsed=distance=travel=drops=celebrationLeft=0; nextDrop=5.5; lastGobble=0;
  bird.y=h*.48; bird.vy=bird.tilt=bird.wing=bird.spin=bird.wattle=bird.wattleSpeed=0;
  gates=[]; fillGates(); lastFlight=null; state='ready';
  $('intro').hidden=$('finish').hidden=$('celebrate').hidden=true;
  $('hud').hidden=false; $('score').textContent='0';
  stage.focus({preventScroll:true});
  HarvestAudio.play('gobble'); flap();
}
function flap() {
  if (state!=='ready' && state!=='flying') return;
  HarvestAudio.unlock(); state='flying'; flaps++;
  bird.vy=-6.75*60*unit; bird.wing=1; bird.wattleSpeed=Math.max(-10,bird.wattleSpeed-8);
  HarvestAudio.play('flap');
  const x=bird.x-15*unit,y=bird.y+4*unit;
  HarvestEffects.burst(flaps%4===1?'leaves':'feathers',x,y,unit);
  if (elapsed-lastGobble>=3.5 && flaps%3===0) {
    lastGobble=elapsed; HarvestAudio.play('gobble'); HarvestEffects.burst('leaves',x,y,unit);
  }
}
function point() {
  score++; $('score').textContent=score; HarvestAudio.play('score');
  if (score%5===0) {
    celebrationLeft=1.65; $('celebrate').hidden=false;
    $('celebrate').textContent=skyNames[(score/5-1)%skyNames.length]+'!';
    if(!reducedMotion.matches) HarvestEffects.burst('feathers',bird.x-14*unit,bird.y,unit);
    HarvestAudio.play('harvest'); HarvestEffects.burst('harvest',bird.x,bird.y,unit*1.3);
    bird.spin=reducedMotion.matches?0:1;
  }
}
function recordFlight(flight) {
  // Merge with other tabs when the browser shares storage.
  const records=new Map([...flights,...getHistory(),flight].map(f=>[f.key,f]));
  flights=[...records.values()].sort(rankFlights).slice(0,20); save(scoreKey,JSON.stringify(flights)); showBest();
}
const landingQuotes=[
  'Even the shortest flight starts with a little courage.',
  'Give your next try the same chance you gave your first.',
  'Leave room for a little wobble.',
  'You only have to find the next opening.',
  'A soft landing is a fine place to begin again.',
  'Look how far those little wings took you.',
  'The sky has room for your kind of flying.',
  'You can be brave and flap wildly at the same time.'
];
let quoteIndex=Math.floor(Math.random()*landingQuotes.length);
function touchDown() {
  if (state!=='flying') return;
  state='landing'; landingLeft=.49; $('celebrate').hidden=true;
  HarvestAudio.play('land'); HarvestEffects.burst('leaves',bird.x,bird.y,unit*1.45);
  lastFlight={key:'thanksgiving-'+uniqueId(),score,distance:Math.floor(distance),date:Date.now()};
  $('retryScore').hidden=true;

  $('finalGates').textContent=score; $('finalMeters').textContent=lastFlight.distance+' m'; $('finalBest').textContent=flights[0].score;
  $('remark').textContent='“'+landingQuotes[quoteIndex]+'”';
  quoteIndex=(quoteIndex+1+Math.floor(Math.random()*(landingQuotes.length-1)))%landingQuotes.length;

function update(dt) {
  if (state==='landing') {
    HarvestEffects.update(dt,0); landingLeft-=dt;
    if (landingLeft<=0) {
      state='over'; $('hud').hidden=true; $('finish').hidden=false; $('replay').focus({preventScroll:true});
    }
    return;
  }
  if (state!=='flying') return;
  skyLevel=Math.min(Math.floor(score/5),skyLevel+dt*.85);
  elapsed+=dt; distance+=12*dt;
  const speed=Math.min(3.5+Math.floor(score/10)*.15,6.5)*60*unit;
  travel+=speed*dt;
  // Original velocity, gravity and terminal speed converted from 60 Hz frames to seconds.
  bird.vy=Math.min(9*60*unit,bird.vy+.375*3600*unit*dt);
  bird.y+=bird.vy*dt;
  const target=clamp(bird.vy/(60*unit)*.075,-.45,.87);
  bird.tilt+=(target-bird.tilt)*(1-Math.exp(-7*dt));
  const hangingAngle=-bird.tilt+.18;
  bird.wattleSpeed+=((hangingAngle-bird.wattle)*86-bird.wattleSpeed*5.6)*dt;
  bird.wattle=clamp(bird.wattle+bird.wattleSpeed*dt,-1.1,1.12);
  bird.wing=Math.max(0,bird.wing-dt*3.6); bird.spin=Math.max(0,bird.spin-dt*1.8);
  HarvestEffects.update(dt,speed);
  if (elapsed>=nextDrop) {
    drops++; const pie=drops%2===1;
    HarvestEffects.burst(pie?'pie':'cranberries',bird.x-2*unit,bird.y+10*unit,unit*1.08);
    if (pie) HarvestAudio.play('pie');
    nextDrop=elapsed+4+Math.random()*2.5;
  }
  if (celebrationLeft>0 && (celebrationLeft-=dt)<=0) $('celebrate').hidden=true;
  const hit=12*unit, gateWidth=70*unit;
  for (const gate of gates) {
    gate.x-=speed*dt;
    if (bird.x+hit>gate.x && bird.x-hit<gate.x+gateWidth
         && (bird.y-hit<gate.center-gate.gap/2 || bird.y+hit>gate.center+gate.gap/2)) {
      touchDown(); return;
    }
    if (!gate.passed && gate.x+gateWidth<bird.x-hit) { gate.passed=true; point(); }
  }
  if (bird.y<hit+4 || bird.y>h-8*unit-hit) { touchDown(); return; }
  gates=gates.filter(g=>g.x+gateWidth>0); fillGates();
}
function render() {
  if (!w || !h) return;
  const title=state==='menu', t=(title && reducedMotion.matches)?0:clock;
  drawValley(ctx,w,h,t,travel,title?'title':'play');
  if (title) { titleArt(t); return; }
  const gateWidth=70*unit;
  for (const g of gates) if (g.x<=w && g.x+gateWidth>=0) drawGate(ctx,g.x,gateWidth,g.center-g.gap/2,g.center+g.gap/2,h,t);
  if(skyLevel>=4 && (Math.floor(skyLevel)-1)%7>=3 && (Math.floor(skyLevel)-1)%7<=5 && !reducedMotion.matches){
    ctx.save();ctx.fillStyle='#fff59c';
    for(let i=0;i<18;i++){
      const x=((i*117-travel*.27)%(w+10)+w+10)%(w+10);
      const y=h*(.59+.27*(i%5)/5)+Math.sin(t*1.6+i)*8*unit;
      ctx.globalAlpha=.55+.3*Math.sin(t*2+i);ctx.beginPath();ctx.arc(x,y,1.9*unit,0,TAU);ctx.fill();
    }
    ctx.restore();
  }
  if(score>=10 && celebrationLeft>0 && !reducedMotion.matches){
    const progress=1-celebrationLeft/1.65;
    ctx.save();ctx.globalAlpha=1-progress;
    const colors=['#ff758d','#ffe26c','#7af1d2','#aea2ff','#ffab69'];
    for(let i=0;i<24;i++){
      const angle=i*2.4, spread=(18+(i%5)*7)*unit*progress;
      const x=w*(i%2?.78:.22)+Math.cos(angle)*spread;
      const y=h*.3+Math.sin(angle)*spread+progress*progress*23*unit;
      ctx.fillStyle=colors[i%colors.length];ctx.save();ctx.translate(x,y);ctx.rotate(angle+progress*4);
      ctx.fillRect(-2*unit,-unit,4*unit,2.2*unit);ctx.restore();
    }
    ctx.restore();
  }
  HarvestEffects.draw(ctx);
  const ready=state==='ready';
  const wing=ready?t*3.5:t*7.5+bird.wing*4.2;
  const angle=bird.tilt+(bird.spin?TAU*(1-bird.spin):0);
  drawTurkey(ctx,bird.x,bird.y+(ready?Math.sin(t*2)*3*unit:0),unit*.265,{time:t,flap:wing,wattle:ready?.34*Math.sin(t*3.5-.8):bird.wattle,tilt:angle,blink:t%4.2>4.02});
}
function frame(now) {
  const dt=previousFrame?Math.min((now-previousFrame)/1000,.05):0;
  previousFrame=now;
  if (!document.hidden && !board.open && state!=='over') {
    clock+=dt;
    // Small steps keep collision checks consistent on displays with different refresh rates.
    const steps=Math.max(1,Math.ceil(dt*120));
    for (let i=0;i<steps;i++) update(dt/steps);
    render();
  }
  requestAnimationFrame(frame);
}

  state='menu'; travel=0; $('intro').hidden=false;

document.addEventListener('keydown',e=>{

// Original Calvey Bird arcade board, with a device-only history available offline.
const sharedURL='https://calveybird-default-rtdb.firebaseio.com/leaderboard';
let activeTab='global';
const boardRequests=new WeakMap();
function displayRows(rows,list=$('list')) {
  list.replaceChildren();
  rows.forEach((row,i)=>{
    const li=document.createElement('li'), left=document.createElement('span'), rank=document.createElement('span'), right=document.createElement('strong');
    rank.className='rank'; rank.textContent=String(i+1).padStart(2,'0');
    left.append(rank,document.createTextNode(row.label)); right.textContent=row.score+(row.score===1?' gate':' gates');
    li.append(left,right); list.append(li);
  });
}
const boardQuery=sharedURL+'.json?orderBy=%22%24key%22&startAt=%22thanksgiving-%22&endAt=%22thanksgiving-~%22';
const nameKey='turkeyFlop_remembered_name';
const latestNamedFlight=flights.filter(f=>typeof f.name==='string' && f.name.trim()).sort((a,b)=>b.date-a.date)[0];
let rememberedName=(read(nameKey) || read('calveybird_name') || latestNamedFlight?.name || '').trim();
if (rememberedName) save(nameKey,rememberedName);
function nameId(name) {
  return name.normalize('NFKC').trim().replace(/\s+/gu,' ').toLowerCase();
}
function bestByName(entries) {
  const best=new Map();
  for (const entry of entries) {
    if (!entry || !Number.isFinite(entry.score) || !entry.name) continue;
    const id=nameId(entry.name), previous=best.get(id);
    if (!previous || rankFlights(entry,previous)<0) best.set(id,entry);
  }
  return [...best.values()].sort(rankFlights);
}
function improves(candidate,current) {
  return !current || candidate.score>current.score ||
    (candidate.score===current.score && candidate.distance>current.distance);
}
async function requestBoard(url,options={}) {
  const controller=new AbortController(), timeout=setTimeout(()=>controller.abort(),8000);
  try {
    const response=await fetch(url,{...options,signal:controller.signal});
    if (!response.ok && response.status!==412) throw new Error(String(response.status));
    return {data:await response.json(),etag:response.headers.get('ETag'),status:response.status};
  } finally { clearTimeout(timeout); }
}
async function saveSharedBest(candidate) {
  const id=nameId(candidate.name);
  const key=Array.from(new TextEncoder().encode(id),byte=>byte.toString(16).padStart(2,'0')).join('');
  const url=sharedURL+'/thanksgiving-best-'+key+'.json';
  let current=await requestBoard(url,{headers:{'X-Firebase-ETag':'true'}});
  if (!current.data) {
    // The previous version stored one row per flight. Keep an older personal best.
    const {data}=await requestBoard(boardQuery);
    for (const row of Object.values(data || {})) {
      if (typeof row?.name==='string' && nameId(row.name)===id && improves(row,candidate)) candidate=row;
    }
  }
  for (let attempt=0;attempt<6;attempt++) {
    if (!improves(candidate,current.data)) return current.data;
    if (!current.etag) throw new Error('Missing score version');
    current=await requestBoard(url,{method:'PUT',headers:{'Content-Type':'application/json','if-match':current.etag},
      body:JSON.stringify({name:candidate.name,score:candidate.score,distance:candidate.distance,
        playerId:candidate.playerId || playerId,timestamp:candidate.timestamp || {'.sv':'timestamp'}})});
    if (current.status!==412) return current.data;
  }
  throw new Error('Concurrent score updates');
}
async function selectTab(which) {
  activeTab=which; boardRequests.delete($('list'));
  $('localTab').setAttribute('aria-pressed',String(which==='local'));
  $('globalTab').setAttribute('aria-pressed',String(which==='global'));
  displayRows([]);
  if (which==='local') {
    $('boardMsg').textContent=flights.length?'':'Finish a flight to record your first score.';
    const rows=bestByName(flights.map(f=>({...f,name:f.name || 'Guest'})));
    displayRows(rows.map(f=>({label:(f.name ? f.name+' · ' : '')+new Date(f.date).toLocaleDateString(undefined,{month:'short',day:'numeric'})+' · '+f.distance+' m',score:f.score})));
    return;
  }
  await loadSharedBoard($('list'),$('boardMsg'));
}
async function loadSharedBoard(list,message) {
  const request={};
  boardRequests.set(list,request);
  message.textContent=list.children.length?'':'Loading scores…';
  try {
    const {data}=await requestBoard(boardQuery);
    if (boardRequests.get(list)!==request) return;
    const entries=Object.values(data || {}).filter(row=>typeof row?.name==='string' && row.name.trim());
    if (!rememberedName) {
      const own=entries.filter(row=>row.playerId===playerId).sort((a,b)=>b.timestamp-a.timestamp)[0];
      if (own) usePlayerName(own.name);
    }
    const rows=bestByName(entries.map(row=>({...row,date:Number(row.timestamp) || 0})));
    displayRows(rows.map(row=>({label:row.name,score:row.score})),list);
    message.textContent=rows.length?'':'No shared scores yet.';
  } catch {
    if (boardRequests.get(list)===request) message.textContent='Couldn’t refresh the shared scores.';
  }
}

async function submitBest(name,flight) {
  $('retryScore').hidden=true;
  flight.name=name;
  recordFlight(flight);
  // Retain a failed personal best so a later, shorter flight can sync it.
  const personalKey='turkeyFlop_best_'+nameId(name);
  let previous;
  try { previous=JSON.parse(read(personalKey)); } catch { /* Ignore invalid cached data. */ }
  const candidate=improves(flight,previous)?{name,score:flight.score,distance:flight.distance}:previous;
  save(personalKey,JSON.stringify(candidate));
  flight.posting=true;
  $('postStatus').textContent='Saving score…';
  try {
    const best=await saveSharedBest(candidate);
    flight.posted=true;
    if (lastFlight===flight) {
      loadSharedBoard($('finishList'),$('finishBoardMsg'));
      $('postStatus').textContent=name+' · Shared best: '+best.score+(best.score===1?' gate.':' gates.');
    }
    if (board.open && activeTab==='global') selectTab('global');
  } catch {
    if (lastFlight===flight) {
      $('retryScore').hidden=false;
      $('postStatus').textContent='Score saved on this device. The shared board is offline.';
    }
  } finally {
    flight.posting=false;
  }
}
new ResizeObserver(resize).observe(stage);
resize(); requestAnimationFrame(frame);
</script>
